[workspace]
resolver = "2"
members = ["gc-align", "gc-track", "gc-infer", "gc-models", "gc-doc", "gc-ocr", "gc-llm", "gc-pair", "gc-link", "gc-live", "gc-render", "gc-camera", "gc-win", "gc-app", "gc-ffi", "gc-mobile", "gc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
lto = "thin"

# The tracker, the image code and the live engine are real-time code, and
# their tests check how well a face is followed at camera speed. Unoptimised,
# the frame thread takes 17 ms a frame on the Windows PC instead of 2.5, and
# those tests fail for a reason that has nothing to do with the code. So these
# crates are optimised in development builds too.
[profile.dev.package.gc-align]
opt-level = 3
[profile.dev.package.gc-track]
opt-level = 3
[profile.dev.package.gc-infer]
opt-level = 3
[profile.dev.package.gc-live]
opt-level = 3
[profile.dev.package.gc-render]
opt-level = 3
# The camera pipeline and the picture codec its recordings use.
[profile.dev.package.gc-camera]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
# The text reader goes over every pixel of a photo more than once.
[profile.dev.package.gc-ocr]
opt-level = 3
