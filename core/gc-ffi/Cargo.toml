[package]
name = "gc-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A static library for the apps to link, and a dynamic one the bindings
# generator reads its description from.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
gc-link = { version = "0.1.0", path = "../gc-link" }
gc-live = { version = "0.1.0", path = "../gc-live" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
uniffi = { version = "0.32.2", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dev-dependencies]
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
