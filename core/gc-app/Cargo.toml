[package]
name = "gc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "What the desktop app's screens show and do, without the screens."

[dependencies]
gc-camera = { version = "0.1.0", path = "../gc-camera" }
gc-infer = { version = "0.1.0", path = "../gc-infer" }
gc-live = { version = "0.1.0", path = "../gc-live" }
# The scanner: the hub that phones and tablets send photos to, and the reader
# whose model files it looks for.
gc-doc = { version = "0.1.0", path = "../gc-doc" }
gc-link = { version = "0.1.0", path = "../gc-link" }
gc-llm = { version = "0.1.0", path = "../gc-llm" }
gc-ocr = { version = "0.1.0", path = "../gc-ocr" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
# Saved faces are sealed with the cipher the pairing already uses.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
# Photos of faces come in these formats. HEIC is read by Windows itself, in gc-win.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The window's side of this crate is written by UniFFI, as for the core.
uniffi = "0.32.2"

# The Windows ends of what the models need: the camera, its pipe, the key
# store, the firewall and the announcement on the local network.
[target.'cfg(windows)'.dependencies]
gc-win = { version = "0.1.0", path = "../gc-win" }

# The tests encode a picture as a stand-in model server sends it.
[dev-dependencies]
base64 = "0.23.1"
