[package]
name = "gc-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
futures-util = "0.3.34"
gc-doc = { version = "0.1.0", path = "../gc-doc" }
gc-pair = { version = "0.1.0", path = "../gc-pair" }
hex = "0.4.3"
# The `ring` library, not the default one: this crate is also built for
# Android and Windows from a Mac, and ring needs no extra tools for that.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "process", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
uuid = { version = "1.29.2", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4"] }
