[package]
name = "gc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
gc-doc = { version = "0.1.0", path = "../gc-doc" }
gc-link = { version = "0.1.0", path = "../gc-link" }
gc-live = { version = "0.1.0", path = "../gc-live" }
gc-render = { version = "0.1.0", path = "../gc-render" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gc-models = { version = "0.1.0", path = "../gc-models" }
# TLS through rustls, with the library the hub already uses.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs"] }

[[bin]]
name = "gc"
path = "src/main.rs"
