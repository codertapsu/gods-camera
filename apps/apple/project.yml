name: GodsCamera
options:
  bundleIdPrefix: dev.godscamera
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  GodsCameraKit:
    path: GodsCameraKit
settings:
  base:
    DEVELOPMENT_TEAM: 4XVYLW8RXS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    # The pack script reads the model store, which is outside the project folder.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  GodsCamera:
    type: application
    platform: macOS
    sources:
      - GodsCamera
    info:
      path: GodsCamera/Info.plist
      properties:
        CFBundleDisplayName: God's Camera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: God's Camera reads your camera to build the picture it sends to other apps.
        NSMicrophoneUsageDescription: God's Camera listens for your voice so it can leave a loop when you start to speak. Nothing is recorded.
        CFBundleLocalizations: [en, vi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.godscamera.GodsCamera
        CODE_SIGN_ENTITLEMENTS: GodsCamera/GodsCamera.entitlements
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "7"
    dependencies:
      - package: GodsCameraKit
      - target: CameraExtension
        embed: true
      # The text reader the hub runs for document jobs, placed beside the app's own program.
      - target: gc-ocr
        embed: true
        codeSign: true
        copy:
          destination: executables
    postBuildScripts:
      - name: Bundle the base models
        script: |
          "${SRCROOT}/../../tools/bundle-packs.sh"
        basedOnDependencyAnalysis: false
  gc-ocr:
    type: tool
    platform: macOS
    sources:
      - path: tools/gc-ocr/Sources/gc-ocr
    settings:
      base:
        PRODUCT_NAME: gc-ocr
        PRODUCT_BUNDLE_IDENTIFIER: dev.godscamera.GodsCamera.ocr
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "7"
        SKIP_INSTALL: YES
  CameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - CameraExtension
      - path: GodsCameraKit/Sources/GodsCameraKit/CameraConfig.swift
        group: CameraExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.godscamera.GodsCamera.CameraExtension
        PRODUCT_NAME: dev.godscamera.GodsCamera.CameraExtension
        # The extension has its own version. macOS replaces the installed extension
        # whenever either number differs, so raise them only when its code changes.
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        INFOPLIST_FILE: CameraExtension/Info.plist
